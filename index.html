<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf8f1" />
  <meta name="description" content="EchoLoom：在第十七秒之后，找回一个被世界遗忘的人。探索五位角色的故事，建立属于你的关系与记忆。无需注册，即刻开始。" />
  <meta name="application-name" content="EchoLoom Interactive Demo" />
  <meta property="og:title" content="EchoLoom · 有些相遇，值得被记住" />
  <meta property="og:description" content="A story worth entering. People worth remembering. A bilingual interactive story with five independent characters and private local saves." />
  <meta property="og:type" content="website" />
  <title>EchoLoom · 有些相遇，值得被记住</title>
  <link rel="icon" href="assets/brand/echoloom-app-icon.png" type="image/png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/brand/echoloom-app-icon.png" />
  <link rel="stylesheet" href="app/styles.css?v=52" />
  <link rel="stylesheet" href="app/website.css?v=1" />
</head>
<body class="website-active">
  <div id="website-home"></div>
  <noscript><p style="padding:32px">EchoLoom 需要启用 JavaScript 才能进入互动故事。Please enable JavaScript to play EchoLoom.</p></noscript>
  <div class="ambient-orb ambient-orb-a" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb-b" aria-hidden="true"></div>

  <div class="demo-shell" id="demo-shell">
    <aside class="desktop-panel desktop-panel-left" aria-label="Story navigation">
      <button id="website-return" class="website-return-button" type="button" data-desktop-action="website-home">← 网站首页</button>
      <div class="panel-brand">
        <img class="panel-brand-lockup" src="assets/brand/echoloom-lockup.png" alt="EchoLoom — Stories weave. Companions stay." />
        <span id="desktop-demo-badge">Offline Prototype</span>
      </div>
      <div id="desktop-nav"></div>
      <div class="panel-insight">
        <span class="eyebrow" id="principle-label">设计原则</span>
        <p id="principle-text"></p>
      </div>
    </aside>

    <main class="phone-stage">
      <div class="phone-shadow" aria-hidden="true"></div>
      <div class="phone-frame" id="phone-frame">
        <div class="phone-speaker" aria-hidden="true"></div>
        <div class="phone-side phone-side-left-a" aria-hidden="true"></div>
        <div class="phone-side phone-side-left-b" aria-hidden="true"></div>
        <div class="phone-side phone-side-right" aria-hidden="true"></div>
        <div id="app" class="app-viewport" tabindex="-1" aria-label="EchoLoom interactive story"></div>
      </div>
    </main>

    <aside class="desktop-panel desktop-panel-right" aria-label="Story and data controls">
      <div class="panel-heading-row">
        <div>
          <span class="eyebrow" id="control-eyebrow">Prototype</span>
          <h2 id="control-title">演示控制</h2>
        </div>
        <button class="icon-button" type="button" data-desktop-action="focus" aria-label="Focus mode" title="Focus mode">
          <span aria-hidden="true">⛶</span>
        </button>
      </div>
      <p class="panel-copy" id="prototype-hint"></p>
      <div class="control-stack">
        <button class="desktop-control" type="button" data-desktop-action="language">
          <span class="control-icon">文</span>
          <span id="language-control-label">English / 中文</span>
          <span class="control-chevron">›</span>
        </button>
        <button class="desktop-control" type="button" data-desktop-action="export">
          <span class="control-icon">⇩</span>
          <span id="export-control-label">导出关系档案</span>
          <span class="control-chevron">›</span>
        </button>
        <label class="desktop-control file-control" for="import-file">
          <span class="control-icon">⇧</span>
          <span id="import-control-label">导入关系档案</span>
          <span class="control-chevron">›</span>
        </label>
        <input id="import-file" class="visually-hidden" type="file" accept="application/json,.json" />
        <button class="desktop-control danger" type="button" data-desktop-action="reset">
          <span class="control-icon">↺</span>
          <span id="reset-control-label">重置原型</span>
          <span class="control-chevron">›</span>
        </button>
      </div>
      <div class="status-card">
        <span class="status-dot"></span>
        <div>
          <strong id="offline-label">离线交互原型 · 无需 API</strong>
          <span id="runtime-details-label"></span>
        </div>
      </div>
      <div class="keyboard-help">
        <kbd>←</kbd><kbd>→</kbd>
        <span>Navigate demo screens</span>
      </div>
    </aside>
  </div>

  <div id="modal-root"></div>
  <div id="storage-notice" class="storage-notice" role="status" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="app/data.js?v=28"></script>
  <script src="app/storage.js?v=20"></script>
  <script src="app/story-engine.js?v=7"></script>
  <script src="app/reply-timing.js?v=2"></script>
  <script src="app/api-engine.js?v=7"></script>
  <script src="app/app.js?v=49"></script>
  <script src="app/website.js?v=1"></script>
</body>
</html>
